<!DOCTYPE html>
<html lang="en" data-accent="volt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="28" y="10" width="44" height="11" fill="%23D4FF00"/><circle cx="50" cy="62" r="27" stroke="%23F8FAFC" stroke-width="13" fill="none"/></svg>'>
<title>ŌLLIN — the 8 engines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0B0C10; --surface:#14161F; --raised:#0E1016; --border:#222634;
  --white:#FFFFFF; --ink:#F8FAFC; --slate:#94A3B8; --body:#C9D3DE; --dim:#77879A;
  --cy:#F8FAFC;
  --em:#FF4500; --em-rgb:255,69,0; --on-em:#180B05; --em-tint:rgba(255,69,0,.12); --em-line:rgba(255,69,0,.26);
}
html[data-accent="volt"]{
  --em:#D4FF00; --em-rgb:212,255,0; --on-em:#14180A; --em-tint:rgba(212,255,0,.12); --em-line:rgba(212,255,0,.26);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:'Archivo',system-ui,sans-serif;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px;overflow-x:clip}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:var(--slate)}
::selection{background:var(--em);color:var(--on-em)}
button{font-family:inherit;cursor:pointer}

.masthead{border-bottom:1px solid var(--border);position:sticky;top:0;
  background:rgba(11,12,16,.55);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  z-index:60}
.mrow{max-width:1200px;margin:0 auto;padding:13px 32px;display:flex;align-items:center;gap:22px}
.mmark{width:20px;height:20px;flex:none;margin-right:-8px}
.mword{font-weight:900;font-size:17px;letter-spacing:-.01em}
.mword i{font-style:normal;color:var(--em)}
.mword .parent{font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--slate);margin-right:8px}
.mnav{display:flex;gap:2px;overflow-x:auto;margin-left:auto}
.mnav a{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:7px 11px;border-radius:6px;white-space:nowrap}
.mnav a:hover{color:var(--white)}
.streak{background:var(--em);color:var(--on-em);border:none;border-radius:6px;padding:8px 13px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;text-decoration:none}

.page{max-width:1200px;margin:0 auto;padding:0 32px}

.hero{padding:150px 0 132px;text-align:center;position:relative}
.kicker{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;justify-content:center}
.kicker .rule{flex:1;height:1px;background:var(--border);align-self:center;max-width:180px}
.hero-mark{width:34px;height:34px;margin:52px auto 0;display:block;opacity:.9}
h1{font-weight:900;font-size:clamp(52px,8.6vw,126px);line-height:.88;letter-spacing:-.055em;margin:38px auto 0;text-transform:uppercase;color:var(--white)}
h1 .v{color:var(--em)}
h1 .hl{background:var(--em);color:var(--on-em);padding:0 .08em;
  box-shadow:0 0 34px rgba(var(--em-rgb),.55),0 0 90px 14px rgba(var(--em-rgb),.45),0 0 180px 30px rgba(var(--em-rgb),.28)}
h1 .accent{position:relative;white-space:nowrap}
h1 .accent::after{content:"";position:absolute;left:.02em;right:.16em;bottom:-.03em;height:3px;background:var(--em);opacity:.9;border-radius:2px}
h1 .scr{display:inline-block}
h1 .v{display:inline-block}
@keyframes flowIn{0%{opacity:0;transform:translateY(32px) scale(.96);filter:blur(12px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes ulineIn{from{opacity:0;transform:scaleX(.2)}to{opacity:.9;transform:none}}
h1.flow-armed .scr,h1.flow-armed .v{opacity:0}
h1.flow-armed .accent::after{opacity:0}
h1.flow .scr,h1.flow .v{animation:flowIn .9s cubic-bezier(.16,1,.3,1) both}
h1.flow .accent::after{transform-origin:left;animation:ulineIn .55s cubic-bezier(.16,1,.3,1) .9s forwards}
h1.scr-armed .v{opacity:0}
h1.scr-armed .accent::after{opacity:0}
h1.scr-armed.reveal1 .p1{opacity:1;transition:opacity .35s ease}
h1.scr-armed.reveal2 .p2{opacity:1;transition:opacity .35s ease}
h1.scr-armed.reveal2 .accent::after{opacity:1;transition:opacity .45s ease}
.hero-tag{font-weight:800;font-size:clamp(20px,3.2vw,36px);letter-spacing:-.02em;line-height:1.06;margin-top:20px;color:#fff}
.hero-tag .accent2{color:var(--em)}
.deck-explain{max-width:760px;margin:38px auto 0;display:flex;flex-direction:column;gap:12px;text-align:center;color:var(--slate);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:clamp(12.5px,1.3vw,14.5px);line-height:1.85;letter-spacing:.02em}
.deck-explain b{color:var(--white)}
.deck-explain .hk{font-weight:800;color:var(--white);text-transform:uppercase;letter-spacing:.04em;font-size:clamp(16px,2vw,21px)}
.hero-flow{margin-top:36px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hero-flow .ar{color:var(--em);margin:0 6px;font-weight:700}
.hero-cta{margin-top:44px}
.hero.js-armed .hero-post{opacity:0;transform:translateY(16px)}
.hero .hero-post.in{opacity:1;transform:none;transition:opacity .65s ease,transform .65s cubic-bezier(.16,1,.3,1)}
.magnet{display:inline-block;will-change:transform}
.magnet .btn-hatch{will-change:transform}
.deck{display:grid;grid-template-columns:1fr;gap:20px;margin:44px auto 0;max-width:680px;align-items:center;text-align:center}
@media(max-width:860px){.deck{grid-template-columns:1fr;gap:26px}}
.deck .standfirst{font-weight:700;font-size:clamp(19px,2.6vw,27px);line-height:1.3;letter-spacing:-.01em}
.deck .standfirst em{font-style:normal;color:var(--em)}
.deck p{color:var(--slate);font-size:15px;max-width:52ch;margin:0 auto}
.deck p b{color:var(--body)}
.hero-a{opacity:0;animation:heroIn .85s cubic-bezier(.18,.85,.24,1) both;will-change:opacity,transform,filter}
@keyframes heroIn{from{opacity:0;transform:translateY(26px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

section{border-top:1px solid var(--border);padding:84px 0}
.sec{display:grid;grid-template-columns:220px 1fr;gap:56px}
@media(max-width:920px){.sec{grid-template-columns:1fr;gap:26px}}
.rail{position:relative}
.rail .inner{position:sticky;top:96px}
.rail .no{font-weight:900;font-size:clamp(44px,6vw,72px);line-height:.9;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.3px #2E3444;
  transition:-webkit-text-stroke-color .5s ease,text-shadow .6s ease}
section.sec-lit .rail .no{-webkit-text-stroke:1.5px var(--white);text-shadow:0 0 24px rgba(248,250,252,.3),0 0 60px -10px rgba(248,250,252,.2)}
.rail .rt{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);margin-top:16px;line-height:2}
.rail .rt b{color:var(--em);font-weight:700}
.rail .rt .sub{color:var(--dim)}
.content h2{font-weight:900;font-size:clamp(34px,5vw,58px);line-height:.94;letter-spacing:-.045em;margin-bottom:18px;text-transform:uppercase}
.content h2 .v{color:var(--em)}
.lede{color:var(--slate);font-size:16.5px;max-width:58ch;margin-bottom:36px;line-height:1.6}
.lede strong{color:var(--white)}
.pull{border-left:2px solid var(--em);padding:6px 0 6px 22px;margin:0 0 36px;font-weight:700;font-size:clamp(17px,2.2vw,21px);line-height:1.4;letter-spacing:-.005em;max-width:56ch}
.pull i{font-style:normal;color:var(--em)}

.blk{border-top:1px solid var(--border);padding:28px 0}
.blk:last-child{border-bottom:1px solid var(--border)}
.bh{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.bh h3{font-weight:900;font-size:16px;letter-spacing:-.005em;text-transform:uppercase}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-weight:700}
.pill.em{background:var(--em-tint);color:var(--em)}
.pill.solid{background:var(--em);color:var(--on-em)}
.pill.dim{background:rgba(148,163,184,.12);color:var(--slate)}
.blk p{color:var(--slate);font-size:14.5px;max-width:70ch}
.blk p b,.blk p strong{color:var(--body)}
.note{font-size:12.5px;color:var(--dim);margin-top:10px}
.note b{color:var(--body)}

.btn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--em);color:var(--on-em);border:1px solid var(--em);border-radius:0;padding:11px 20px;font-weight:700;text-decoration:none;display:inline-block;
  transition:transform .22s cubic-bezier(.22,.8,.28,1),background .15s,color .15s,border-color .15s}
.btn:hover{background:transparent;color:var(--em);transform:scale(1.035)}
.btn:active{transform:scale(.975)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--slate)}
.btn.ghost:hover{color:var(--white);border-color:var(--slate)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hatched CTA button */
.btn-hatch{position:relative;display:inline-flex;align-items:center;gap:16px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--white);text-decoration:none;background-color:var(--surface);
  background-image:repeating-linear-gradient(-45deg,rgba(248,250,252,.05) 0,rgba(248,250,252,.05) 1px,transparent 1px,transparent 7px);
  border:1px solid var(--border);padding:17px 26px;cursor:pointer;overflow:hidden;
  transition:border-color .2s,background-color .2s,color .2s}
.btn-hatch:hover{border-color:var(--em);background-color:var(--raised);box-shadow:0 0 0 4px rgba(var(--em-rgb),.10),0 12px 34px -10px rgba(var(--em-rgb),.55),0 0 26px -2px rgba(var(--em-rgb),.6),0 0 80px -14px rgba(var(--em-rgb),.45)}
.btn-hatch .plus{position:relative;width:15px;height:15px;flex:none;color:var(--white);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.btn-hatch .plus::before,.btn-hatch .plus::after{content:"";position:absolute;background:currentColor}
.btn-hatch .plus::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
.btn-hatch .plus::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
.btn-hatch:hover .plus{transform:rotate(90deg)}
.btn-hatch .cn{position:absolute;bottom:6px;height:2px;width:26px;background:var(--em);
  box-shadow:0 0 10px rgba(var(--em-rgb),.6);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.btn-hatch .cn.l{left:8px;transform-origin:left}
.btn-hatch .cn.r{right:8px;transform-origin:right}
.btn-hatch:hover .cn.l,.btn-hatch:hover .cn.r{transform:scaleX(2.4)}

.big{font-weight:900;font-size:clamp(44px,6vw,74px);line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.big em{font-style:normal}
.big .unit{font-size:.45em;letter-spacing:0;color:var(--slate)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--border)}
@media(max-width:620px){.statgrid{grid-template-columns:1fr}}
.stat{padding:26px 22px}
.stat+.stat{border-left:1px solid var(--border)}
@media(max-width:620px){.stat+.stat{border-left:none;border-top:1px solid var(--border)}}
.stat .src{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);line-height:1.8}
.stat .t{color:var(--slate);font-size:13.5px;margin-top:12px;line-height:1.55}
.stat .t strong{color:var(--body)}

table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th{font-family:'IBM Plex Mono',monospace;color:var(--dim);text-align:left;font-size:9px;letter-spacing:.14em;padding:10px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;font-weight:500}
td{padding:11px 8px;border-bottom:1px solid var(--border);color:var(--body)}
td b{color:var(--white)}
td .mono{font-size:9px}

.post-item{border:1px solid var(--border);padding:16px;margin-top:12px;max-width:640px}
.post-item .subj{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--em);margin-bottom:12px}
.post-item .bodytxt{font-size:14.5px;color:var(--body);line-height:1.6}
.post-item .bodytxt p{margin-bottom:10px}
.post-item .bodytxt strong{color:var(--white)}
.post-item .meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);letter-spacing:.05em;border-top:1px solid var(--border);padding-top:12px}

.ecar{position:relative;padding:14px 60px 0;margin-top:8px}
.car-stage{position:relative;height:576px;perspective:1600px;perspective-origin:50% 50%}
.car-stage::before{content:"";position:absolute;left:50%;top:50%;width:min(760px,92vw);height:470px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side, rgba(var(--em-rgb),.16), rgba(var(--em-rgb),.05) 55%, transparent 75%);
  filter:blur(14px);animation:stageBreathe 5.5s ease-in-out infinite}
@keyframes stageBreathe{0%,100%{opacity:.75}50%{opacity:1}}
.car-track{position:absolute;inset:0;transform-style:preserve-3d}
.car-card{position:absolute;left:50%;top:50%;width:280px;height:400px;margin:-200px 0 0 -140px;
  background:var(--raised);border:1px solid var(--border);border-radius:20px;padding:26px 24px;
  display:flex;flex-direction:column;cursor:pointer;transform-style:preserve-3d;backface-visibility:hidden;
  box-shadow:0 0 0 1px var(--border),0 20px 50px -10px rgba(0,0,0,.85);overflow:hidden;
  transition:width .62s cubic-bezier(.16,1,.3,1),height .62s cubic-bezier(.16,1,.3,1),
             margin .62s cubic-bezier(.16,1,.3,1),padding .62s cubic-bezier(.16,1,.3,1),
             transform .62s cubic-bezier(.16,1,.3,1),filter .6s cubic-bezier(.16,1,.3,1),
             opacity .6s ease,box-shadow .4s ease,border-color .3s ease}
.car-card[data-pos="0"]{width:min(680px,86vw);height:484px;margin:-242px 0 0 max(-340px,-43vw);
  padding:30px 34px 26px;
  transform:translateZ(90px) rotateY(0deg) scale(1);opacity:1;filter:none;z-index:5}
.car-card[data-pos="-1"]{transform:translateX(-512px) translateZ(0) rotateY(24deg) scale(.95);opacity:.8;filter:blur(1.5px);z-index:4}
.car-card[data-pos="1"]{transform:translateX(512px) translateZ(0) rotateY(-24deg) scale(.95);opacity:.8;filter:blur(1.5px);z-index:4}
.car-card[data-pos="-2"],.car-card[data-pos="2"],.car-card[data-pos="hidden"]{
  transform:translateZ(-200px) scale(.7);opacity:0;filter:blur(6px);pointer-events:none;z-index:1}
.car-card.is-active{border-color:var(--em);cursor:default;
  box-shadow:inset 0 1px 0 rgba(248,250,252,.06),0 0 0 1px var(--em-line),
    0 0 26px -4px rgba(var(--em-rgb),.38),0 0 90px -18px rgba(var(--em-rgb),.30),
    0 34px 80px -18px rgba(var(--em-rgb),.20),0 34px 70px -12px rgba(0,0,0,.75)}
.ec-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ec-eng{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:-.01em;border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--slate);background:rgba(248,250,252,.035);white-space:nowrap}
.ec-ico{color:var(--ink);display:block;margin:26px 0 14px}
.ec-ico svg{width:30px;height:30px;transition:width .5s cubic-bezier(.16,1,.3,1),height .5s cubic-bezier(.16,1,.3,1)}
.ec-name{font-weight:900;font-size:25px;letter-spacing:-.04em;line-height:1.03;margin-bottom:16px;text-transform:uppercase}
.car-card:not(.is-active) .ec-ico{margin-top:auto;margin-bottom:18px}
.car-card.is-active .ec-ico{display:none}
.car-card:not(.is-active) .ec-name{margin-bottom:auto;font-size:22px}
.car-card:not(.is-active) .ec-ico svg{width:46px;height:46px}
.car-card:not(.is-active) .ec-full{height:0;margin:0;overflow:hidden}
.car-card .ec-ico,.car-card .ec-name{transition:margin .5s cubic-bezier(.16,1,.3,1),font-size .5s cubic-bezier(.16,1,.3,1)}
.ec-full{opacity:0;transform:translateY(8px);pointer-events:none;height:0;overflow:hidden;
  transition:opacity .4s ease .06s,transform .55s cubic-bezier(.16,1,.3,1) .06s}
.car-card.is-active .ec-full{opacity:1;transform:none;pointer-events:auto;height:auto}
.ec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ec-box{border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--surface)}
.ec-box .ic{color:var(--ink);display:block;margin-bottom:11px}
.ec-box .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin-bottom:7px}
.ec-box p{font-size:13.5px;line-height:1.55;color:var(--slate);margin:0}
.ec-box.why p{color:var(--ink)}
.ec-hand{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);
  padding-top:14px;font-size:12.5px;line-height:1.5;color:var(--slate)}
.ec-hand .c{width:21px;height:21px;border-radius:50%;background:var(--black);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);flex:none}
.ec-hand b{color:var(--ink);font-weight:600}
.ec-spec{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--em);text-decoration:none;border:1px solid var(--em-line);background:var(--em-tint);border-radius:6px;padding:8px 12px;transition:background .15s,color .15s}
.ec-spec:hover{background:var(--em);color:var(--on-em)}
.ec-spec span{font-size:12px}
.emod-paths{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.emod-paths .k{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--dim)}
.ppills{display:flex;flex-wrap:wrap;gap:8px}
.ppill{display:inline-flex;align-items:center;gap:8px;border-radius:100px;padding:7px 14px 7px 11px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  color:#F8FAFC;border:1px solid rgba(248,250,252,.26);background:rgba(248,250,252,.06)}
.ppill i{width:7px;height:7px;border-radius:50%;flex:none;background:#F8FAFC}
.car-nav{position:absolute;top:288px;transform:translateY(-50%);z-index:20;width:46px;height:46px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(248,250,252,.30);font-size:22px;line-height:1;color:var(--ink);
  box-shadow:0 0 0 1px var(--border),0 0 14px rgba(248,250,252,.28),0 0 34px -6px rgba(248,250,252,.22),0 10px 24px -8px rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;padding:0 0 3px;transition:transform .18s,border-color .18s,box-shadow .25s}
.car-nav:hover{transform:translateY(-50%) scale(1.07);border-color:rgba(248,250,252,.6);
  box-shadow:0 0 0 1px var(--border),0 0 20px rgba(248,250,252,.45),0 0 46px -6px rgba(248,250,252,.32),0 10px 24px -8px rgba(0,0,0,.7)}
.car-nav.prev{left:0}.car-nav.next{right:0}
.car-dots{display:flex;justify-content:center;gap:8px;margin-top:14px;position:relative;z-index:10}
.car-dot{width:34px;height:4px;border-radius:100px;background:var(--border);border:0;padding:0;transition:background .22s,width .22s}
.car-dot.on{background:var(--em);width:52px}
@media(max-width:900px){.ec-grid{grid-template-columns:1fr;gap:10px}
  .car-stage{height:620px}

  background:linear-gradient(90deg,transparent,var(--em) 18%,var(--em) 82%,transparent);

            '<div class="ec-box"><span class="ic"><svg viewBox="0 0 24 24" width="24" height="24" '+S+'>'+e.ico+'</svg></span>'+
              '<div class="k">What it does</div><p>'+e.what+'</p></div>'+
            '<div class="ec-box why"><span class="ic"><svg viewBox="0 0 24 24" width="24" height="24" '+S+'><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="3"/></svg></span>'+
              '<div class="k">Why it matters</div><p>'+e.why+'</p></div>'+
          '</div>'+
          '<div class="ec-hand"><span class="c">&#8635;</span><span>'+handoff(i)+'</span></div>'+
          (e.link?'<a class="ec-spec" href="'+e.link+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open the Engine '+e.num+' spec <span>&#8599;</span></a>':'')+
        '</div>';
      c.addEventListener('click',function(){ if(i!==active) goTo(i); });
      c.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); if(i!==active) goTo(i);} });
      host.appendChild(c); cards.push(c);
      var d=document.createElement('button');
      d.className='car-dot'; d.type='button';
      d.setAttribute('aria-label','Engine '+e.num);
      d.addEventListener('click',function(){ goTo(i); });
      dotsEl.appendChild(d); dots.push(d);
    });
    function shortestOffset(i,a,len){ var d=i-a; if(d>len/2)d-=len; if(d<-len/2)d+=len; return d; }
    function render(){
      for(var k=0;k<n;k++){
        var off=shortestOffset(k,active,n);
        cards[k].setAttribute('data-pos', Math.abs(off)>2 ? 'hidden' : String(off));
        cards[k].classList.toggle('is-active', off===0);
        cards[k].setAttribute('aria-hidden', Math.abs(off)>2 ? 'true':'false');
        dots[k].classList.toggle('on', k===active);
      }
    }
    function rotate(dir){ active=(active+dir+n)%n; render(); }
    function goTo(i){ active=i; render(); }
    if(prev) prev.addEventListener('click',function(){ rotate(-1); });
    if(next) next.addEventListener('click',function(){ rotate(1); });
    var stage=document.querySelector('.car-stage');
    if(stage){
      stage.tabIndex=0;
      stage.addEventListener('keydown',function(e){
        if(e.key==='ArrowLeft'){ e.preventDefault(); rotate(-1); }
        if(e.key==='ArrowRight'){ e.preventDefault(); rotate(1); }
      });
      var sx=null;
      stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
      stage.addEventListener('touchend',function(e){
        if(sx===null) return;
        var d=e.changedTouches[0].clientX-sx; sx=null;
        if(Math.abs(d)>50) rotate(d<0?1:-1);
      });
    }
    render();
  }
})();
</script>
</body>
</html>
